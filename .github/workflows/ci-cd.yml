# NO TOCAR JAMAS ESTE ARCHIVO!!!!!!!!!!!!!!!
name: CI/CD Pipeline (SonarQube + Dokploy)

on:
  push:
    branches:
      - main

jobs:
  # ETAPA 1: Compilación de java
  check-compilacion:
    name: Verificar Compilación (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # <--- Ajustado a Dockerfile
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar con Maven
        # Ejecutamos el empaquetado saltando tests para verificar que el código es válido
        # Añadimos -f para indicarle el archivo pom exacto
        run: mvn -f vulncheckerbackend/pom.xml clean package -DskipTests -B

      - name: Subir clases compiladas para SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: java-classes
          path: vulncheckerbackend/target/classes

  # ETAPA 1.5: Análisis de Vulnerabilidades en Dependencias (OWASP Dependency-Check)
  owasp-dependency-check:
    name: OWASP Dependency-Check (SCA)
    needs: check-compilacion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Escaneo OWASP Dependency-Check (Full App)
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DEVSECOPS-LAB-VULNCHECKER'
          format: 'HTML'
          out: 'reports'
          # Le decimos que escanee desde la raíz ('.' analiza backend y frontend)
          args: '--scan . --enableExperimental'

      - name: Subir Reporte OWASP como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: reports/dependency-check-report.html
        
  # ETAPA 2: Análisis de Calidad con Sonar
  sonarqube:
    name: Análisis de Código + Cobertura
    needs: check-compilacion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar clases compiladas
        uses: actions/download-artifact@v4
        with:
          name: java-classes
          path: vulncheckerbackend/target/classes

      # ---> AGREGAMOS ESTE PASO AQUÍ PARA EVITAR EL ERROR HTTP 403 <---
      - name: Configurar JDK 21 para Sonar
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Backend tests + JaCoCo
        run: mvn -f vulncheckerbackend/pom.xml test jacoco:report -B

      - name: Copiar dependencias Maven para sonar.java.libraries
        run: mvn -f vulncheckerbackend/pom.xml dependency:copy-dependencies -DoutputDirectory=target/dependency -B -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        run: npm ci
        working-directory: frontend

      - name: Frontend tests + cobertura (lcov)
        run: npm run test:coverage
        working-directory: frontend

      - name: Escaneo de SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Verificar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        continue-on-error: true # comentar o descomentar segun se quiera bloquear el pipeline ante un fallo en el Quality Gate de Sonar
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  # ETAPA 3: TRABAJO PESADO DOCKER (GitHub Motor) + ANÁLISIS DE VULNERABILIDADES (SCA CONTENEDORES)
  build-docker:
    name: Construir e Inspeccionar Imagen Docker
    needs: sonarqube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Paso 3.1: Construcción del artefacto en el Docker Daemon local del runner
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest -f vulncheckerbackend/Dockerfile ./vulncheckerbackend

      # Paso 3.2: Control de Calidad de Seguridad (Security Gate) con Trivy
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master # <--- Usamos la acción oficial de Trivy para GitHub Actions
        # continue-on-error: true
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest'
          scan-type: 'image'
          format: 'table'
          exit-code: '1' # '0' para pasar siempre, '1' para fallar si se detecta una vulnerabilidad específicada en severity
          ignore-unfixed: true # Ignora vulnerabilidades sin un parche en el mercado
          severity: 'CRITICAL' # Umbral estricto: Bloquea el pipeline solo ante riesgos Altos o Críticos.

      # Paso 3.3: Publicación del artefacto (Solo se ejecuta si Trivy retornó exit-code 0)
      - name: Push Docker Image to GHCR
        run: |
          # NO TOCAR NUNCA NADA AQUI. Le creamos un clon/duplicado con la etiqueta fija 'v1-estable'
          # docker tag ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v1-estable
          # docker tag ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v2-estable
          # docker tag ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v3-estable
          # docker tag ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v4-estable
          # docker tag ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v5-estable
          docker push ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:latest
          # docker push ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v5-estable
          # docker push ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v4-estable
          # docker push ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v3-estable
          # docker push ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v2-estable
          # docker push ghcr.io/${{ github.repository_owner }}/backend-vulnchecker:v1-estable

  # ETAPA 4: Despliegue con Aprobación (Dokploy solo descarga)
  deploy:
    name: Despliegue en Dokploy
    needs: build-docker
    runs-on: ubuntu-latest
    environment: Production # Esto activa el botón de aprobación manual
    steps:
      - name: Trigger Deployment via API
        run: |
          curl -X 'POST' \
            'http://157.230.177.115:3000/api/application.deploy' \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H 'x-api-key: ${{ secrets.DOKPLOY_TOKEN }}' \
            -d '{
            "applicationId": "${{ secrets.DOKPLOY_APP_ID }}"
          }'

  # ETAPA 5: Análisis de Seguridad Dinámico (DAST con OWASP ZAP)
  owasp-zap-dast:
    name: OWASP ZAP Full Scan (Controlado)
    needs: deploy # Espera a que Dokploy complete el despliegue
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que la app inicie tras el despliegue
        run: sleep 60 # Espera 60s a que el contenedor y Traefik respondan

      - name: Escaneo ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'https://157.230.177.115.nip.io'
          # Usamos -z para pasar configuraciones nativas a ZAP sin confundir al script ejecutor
          cmd_options: '-z "-config hostperscan.threadsPerHost=5 -config activeScan.maxRuleDurationInMins=5 -config activeScan.maxScanDurationInMins=25"'
          allow_issue_writing: false
          fail_action: false

      - name: Subir Reporte ZAP como Artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-dast-report
          path: zap_report.html
