name: CI/CD Pipeline (SonarQube + Dokploy)

on:
  push:
    branches:
      - main

jobs:
  # ETAPA 1: Análisis de Calidad con Sonar
  sonarqube:
    name: Análisis de Código
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Verificar Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ETAPA 2: Compilación en GitHub (Para no cargar en servidor)
  build:
    name: Compilación y Build
    needs: sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # <--- Ajustado a Dockerfile
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar con Maven
        # Ejecutamos el empaquetado saltando tests para verificar que el código es válido
        run: mvn clean package -DskipTests -B

  # ETAPA 3: Despliegue con Aprobación
  deploy:
    name: Despliegue en Dokploy
    needs: build  # Esto bloquea el despliegue si SonarQube falla
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Llamar a Webhook de Dokploy
        run: |
          curl -L -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}?branch=main" \
          -H "Content-Type: application/json" \
          -d '{"branch": "main"}'
