name: Coverage Report for SonarCloud

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  coverage:
    name: Tests + Coverage Report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests + JaCoCo
        run: mvn -f vulncheckerbackend/pom.xml test jacoco:report -B

      - name: Copiar dependencias Maven para sonar.java.libraries
        run: mvn -f vulncheckerbackend/pom.xml dependency:copy-dependencies -DoutputDirectory=target/dependency -B -q

      - name: Instalar dependencias frontend
        run: npm ci
        working-directory: frontend

      - name: Frontend tests + cobertura (lcov)
        run: npm run test:coverage
        working-directory: frontend

      - name: Verificar reportes de cobertura
        run: |
          echo "=== jacoco.exec ==="
          ls -lh vulncheckerbackend/target/jacoco.exec 2>&1 || echo "MISSING"
          echo "=== JaCoCo XML ==="
          wc -l vulncheckerbackend/target/site/jacoco/jacoco.xml 2>&1 || echo "MISSING"
          echo "=== Dependencias copiadas ==="
          ls vulncheckerbackend/target/dependency/*.jar 2>&1 | wc -l || echo "MISSING"
          echo "=== LCOV ==="
          wc -l frontend/coverage/lcov.info 2>&1 || echo "MISSING"
          echo "=== LCOV source paths ==="
          grep "^SF:" frontend/coverage/lcov.info 2>&1 | head -5 || echo "MISSING"

      - name: Escaneo SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: .
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
